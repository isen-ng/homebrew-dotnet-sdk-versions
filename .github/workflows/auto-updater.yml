name: auto-updater

on:
  schedule:
    # 22:17 UTC (06:17 GMT+8) daily. Off the hour because GitHub delays or drops top-of-hour schedules.
    # Order: auto-updater 22:17 -> auto-meta-updater 00:17 -> auto-readme-updater 02:17 -> auto-pr-checker 03:47
    # Each updater's pull requests auto-merge once CI passes, well before the next updater runs.
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Push with the PAT, not GITHUB_TOKEN: pushes made with GITHUB_TOKEN don't trigger CI on the PR.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.UPDATER_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set git username and email, so we can commit and push
        run: |
          git config --global user.email "3904043+isen-ng@users.noreply.github.com"
          git config --global user.name "Isen Ng"

      - name: Run auto_updater.py
        env:
          GITHUB_TOKEN: ${{ secrets.UPDATER_PUSH_TOKEN }}
        run: ./auto_updater.py --really_push
