name: continuous-integration

on:
  pull_request:
    branches: [ master ]

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_FROM_API: 1
  HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  ensure-aiskills-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Sync Script
        run: |
          ./sym-link-aiskills.sh
      - name: Check for Changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ It seems like you've made changes in .aiskills! Run ./sym-link-aiskills.sh to sync them to various agent specific folders"
            git diff
            exit 1
          fi

  generate-matrix:
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: true

      - name: Check out Pull Request
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run brew config
        run: brew config

      - name: Generate CI matrix
        id: generate-matrix
        env:
          PULL_REQUEST_URL: ${{ github.event.pull_request.url }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]
          then
            brew generate-cask-ci-matrix --syntax-only
          else
            brew generate-cask-ci-matrix --url "$PULL_REQUEST_URL"
          fi

  test:
    name: ${{ matrix.name }}
    needs: generate-matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: true

      - name: Disable API installs
        run: echo 'HOMEBREW_NO_INSTALL_FROM_API=1' >> "${GITHUB_ENV}"

      - name: Tap isen-ng/dotnet-sdk-versions
        run: brew tap isen-ng/dotnet-sdk-versions

      - name: Checkout pull request
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Homebrew Gems
        id: cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.runner }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.runner }}-rubygems-

      - name: Run brew fetch --cask ${{ matrix.cask.token }}
        id: fetch
        run: |
          brew fetch --cask --retry --force ${{ join(matrix.fetch_args, ' ') }} '${{ matrix.tap }}/${{ matrix.cask.token }}'
        timeout-minutes: 30
        if: always() && matrix.cask

      - name: Run brew style ${{ matrix.cask.token }}
        run: brew style '${{ matrix.cask.path }}'
        if: always() && steps.fetch.outcome == 'success' && matrix.cask.token

      - name: Run brew audit --cask ${{ matrix.cask.token }}
        id: audit
        run: |
          # these EOL casks fail macOS signature verification because 
          # they are old and not updated anymore, so we simply don't check their signatures
          EOL_CASKS=("dotnet-sdk2-2-100" "dotnet-sdk2-2-200")
          
          AUDIT_ARGS="${{ join(matrix.audit_args, ' ') }}"
          if printf '%s\n' "${EOL_CASKS[@]}" | grep -qx '${{ matrix.cask.token }}'; then
            AUDIT_ARGS="${AUDIT_ARGS/--signing/}"
          fi

          brew audit --cask ${AUDIT_ARGS} '${{ matrix.tap }}/${{ matrix.cask.token }}'
        timeout-minutes: 30
        if: >
          always() &&
          steps.fetch.outcome == 'success' &&
          !matrix.skip_audit

      # Homebrew no longer loads casks from arbitrary file paths, so `brew cask-ci`
      # is given the cask's path inside the tapped repository instead of `./Casks/...`.
      - name: Gather cask information
        id: info
        env:
          CASK_PATH: ${{ matrix.cask.path }}
          TAP: ${{ matrix.tap }}
        run: |
          tap_cask_path="$(brew --repository "$TAP")/${CASK_PATH#./}"
          echo "TAP_CASK_PATH=$tap_cask_path" >> "$GITHUB_ENV"
          brew cask-ci info "$tap_cask_path"
        if: always() && steps.fetch.outcome == 'success' && matrix.cask

      - name: Uninstall conflicting formulae
        run: |
          read -r -a formula_conflicts_array <<< "$FORMULA_CONFLICTS"
          brew uninstall --formula "${formula_conflicts_array[@]}"
        if: ${{ always() && steps.info.outcome == 'success' && env.FORMULA_CONFLICTS != '' }}
        timeout-minutes: 30

      - name: Uninstall conflicting casks
        run: |
          read -r -a cask_conflicts_array <<< "$CASK_CONFLICTS"
          brew uninstall --cask "${cask_conflicts_array[@]}"
        if: ${{ always() && steps.info.outcome == 'success' && env.CASK_CONFLICTS != '' }}
        timeout-minutes: 30

      - name: Run brew uninstall --cask --force --zap ${{ matrix.cask.token }}
        run: |
          brew uninstall --cask --force --zap '${{ matrix.tap }}/${{ matrix.cask.token }}'
        if: always() && steps.info.outcome == 'success'
        timeout-minutes: 30

      - name: Run pkgutil before installation
        id: packages-before-installation
        run: |
          PACKAGES=$(pkgutil --pkgs)
          echo "PACKAGES_BEFORE_INSTALL<<EOF" >> $GITHUB_ENV
          echo "$PACKAGES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        if: always() && steps.info.outcome == 'success' && !matrix.skip_install
        timeout-minutes: 1

      - name: Run brew cask-ci install ${{ matrix.cask.token }}
        id: install
        run: brew cask-ci install "$TAP_CASK_PATH"
        if: >
          always() && steps.info.outcome == 'success' &&
          fromJSON(steps.info.outputs.macos_requirement_satisfied) &&
          !matrix.skip_install
        timeout-minutes: 30

      - name: List installed packages
        id: packages-after-installation
        run: |
          PACKAGES=$(pkgutil --pkgs) >> $GITHUB_ENV
          echo "PACKAGES_AFTER_INSTALL<<EOF" >> $GITHUB_ENV
          echo "$PACKAGES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          diff <(echo "${{ env.PACKAGES_BEFORE_INSTALL }}") <(echo "$PACKAGES") || true
        if: always() && steps.info.outcome == 'success' && !matrix.skip_install
        timeout-minutes: 1

      - name: Run brew uninstall --cask ${{ matrix.cask.token }}
        run: brew uninstall --cask '${{ matrix.tap }}/${{ matrix.cask.token }}'
        if: always() && steps.install.outcome == 'success' && !fromJSON(steps.info.outputs.manual_installer)
        timeout-minutes: 30

      - name: Uninstall cask dependencies
        run: |
          read -r -a cask_dependencies_array <<< "$CASK_DEPENDENCIES"
          brew uninstall --cask "${cask_dependencies_array[@]}"
        if: ${{ always() && steps.install.outcome == 'success' && env.CASK_DEPENDENCIES != '' }}
        timeout-minutes: 30

      - name: List uninstalled packages
        run: diff <(echo "${{ env.PACKAGES_AFTER_INSTALL }}") <(pkgutil --pkgs) || true
        if: always() && steps.info.outcome == 'success' && !matrix.skip_install
        timeout-minutes: 1

  conclusion:
    name: conclusion
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Result
        run: ${{ needs.test.result == 'success' }}
